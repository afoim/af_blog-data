name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: node convert-to-webp.js

      - run: node generate-posts.js

      - name: Prepare dist directory
        run: |
          cp -r img/* dist/img/
          cp _headers dist/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      # 通知大前端（2x.nz）重建：博客正文已改为构建期预渲染成静态壳
      # （posts/<slug>/index.html），新文章/改文必须让大前端重新构建并部署
      # （deploy-cf.mjs → wrangler）预渲染壳才会跟上。前端那边
      # .github/workflows/blog-redeploy.yml 监听 repository_dispatch。
      #
      # 需要给本仓库加一个 secret：SVAF_DEPLOY_PAT —— 对 afoim/af_frontend
      # 有 repo 权限的 PAT（经典 PAT 或 fine-grained 都行）。没配时跳过并警告。
      # 失败不该阻断已经成功的 CDN 部署，所以 continue-on-error —— 但仍会显红。
      #
      # 之前那个 /internal/revalidate webhook 是给已失联的 Oracle VPS 用的，已废弃。
      - name: 触发大前端重建（博客预渲染壳同步）
        continue-on-error: true
        env:
          PAT: ${{ secrets.SVAF_DEPLOY_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::未配置 SVAF_DEPLOY_PAT，跳过触发大前端重建"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/afoim/af_frontend/dispatches \
            -d '{"event_type":"blog-updated"}'
